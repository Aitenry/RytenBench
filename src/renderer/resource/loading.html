<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASETools - Loading...</title>
  <link rel="stylesheet" href="css/loading.css">
</head>
<body>
<div class="loading-container">
  <div class="content-wrapper">
    <div class="header-section">
      <div class="logo">
        <img src="image/icon.png" alt="ASETools Logo">
      </div>
      <div class="title-section">
        <h2 class="title">ASETools <span class="version">v1.0.0</span></h2>
        <p class="subtitle">基于AI的个人轻量级工作台</p>
      </div>
    </div>
    <div class="progress-section">
      <div class="progress-container">
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-text">
          <span id="progressText">0%</span>
        </div>
      </div>
      <div class="task-info">
        <div class="task-row">
          <p class="current-task" id="currentTask">正在初始化...</p>
          <p class="task-progress" id="taskProgress">加载进度 0/0</p>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module" src="script/loading.ts"></script>
</body>
</html>

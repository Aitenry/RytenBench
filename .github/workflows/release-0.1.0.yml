name: Build RytenBench 0.151.0-alpha

on:
  push:
    branches:
      - '0.1.0'

concurrency:
  group: release-0.1.0
  cancel-in-progress: false

permissions:
  contents: write

env:
  RELEASE_PREFIX: 0.151.0-alpha
  FALLBACK_TAG: v0.1.0

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            script: build:win
            artifact_pattern: dist/*.exe
          - platform: macos
            os: macos-latest
            script: build:mac
            artifact_pattern: |
              dist/*.dmg
              dist/*.zip
          - platform: linux
            os: ubuntu-latest
            script: build:linux
            artifact_pattern: |
              dist/*.AppImage
              dist/*.deb

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: '0.1.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installer
        run: pnpm ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: ${{ matrix.artifact_pattern }}
          if-no-files-found: error

  release:
    name: Publish 0.151.0-alpha release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: '0.1.0'
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve next release version
        id: version
        uses: actions/github-script@v7
        env:
          RELEASE_PREFIX: ${{ env.RELEASE_PREFIX }}
          FALLBACK_TAG: ${{ env.FALLBACK_TAG }}
          RUN_NUMBER: ${{ github.run_number }}
        with:
          script: |
            const prefix = process.env.RELEASE_PREFIX
            const escapedPrefix = prefix.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
            const pattern = new RegExp(`^${escapedPrefix}\\.(\\d+)\\.(\\d+)$`)
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            })

            let previousTag = process.env.FALLBACK_TAG || ''
            let best = null
            for (const release of releases) {
              const match = pattern.exec(release.tag_name)
              if (!match) continue
              const candidate = [Number(match[1]), Number(match[2])]
              if (!best || candidate[0] > best[0] || (candidate[0] === best[0] && candidate[1] > best[1])) {
                best = candidate
                previousTag = release.tag_name
              }
            }

            let nextVersion
            if (best) {
              nextVersion = `${prefix}.${best[0]}.${best[1] + 1}`
            } else {
              const runNumber = Math.max(1, Number(process.env.RUN_NUMBER || '0'))
              nextVersion = `${prefix}.${runNumber}.1`
            }

            core.setOutput('version', nextVersion)
            core.setOutput('previous_tag', previousTag)

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: installer-windows
          path: release/windows

      - name: Download macOS installer
        uses: actions/download-artifact@v4
        with:
          name: installer-macos
          path: release/macos

      - name: Download Linux installer
        uses: actions/download-artifact@v4
        with:
          name: installer-linux
          path: release/linux

      - name: Compose release notes
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
          SHA: ${{ github.sha }}
        run: |
          if [ -n "${PREVIOUS_TAG}" ]; then
            git log --no-merges --pretty=format:'- %s' "${PREVIOUS_TAG}..HEAD" > changes.txt 2>/dev/null || true
          fi
          if [ ! -s changes.txt ]; then
            printf '%s\n' '- 本次为当前分支的构建发布。' > changes.txt
          fi
          {
            echo '## 更新内容'
            cat changes.txt
            echo
            echo '## 构建信息'
            echo "- 版本：${VERSION}"
            echo "- 提交：${SHA}"
            echo '- 平台：Windows (NSIS)、macOS (DMG/ZIP)、Linux (AppImage/DEB)'
          } > release-body.md
          echo "path=release-body.md" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            release/windows/*.exe
            release/macos/*.dmg
            release/macos/*.zip
            release/linux/*.AppImage
            release/linux/*.deb
          fail_on_unmatched_files: false
          make_latest: true
